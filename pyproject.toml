[tool.poetry]
name = "github-issue-triage-ai"
version = "0.1.0"
description = "GitHub issue'larını dört kategoriye ayıran MLOps projesi"
authors = ["Berra Birinci", "Pınar Ayşe Aslan", "Phoo Thet Chal"]
package-mode = false

[tool.poetry.dependencies]
python = ">=3.12,<3.16"
pandas = "*"
requests = "*"
scikit-learn = "*"
joblib = "*"
mlflow-skinny = "3.17.1"
sqlalchemy = "2.1.4"
alembic = "1.20.0"

[tool.poetry.group.dev.dependencies]
pytest = "*"

[tool.poetry.group.ui]
optional = true

[tool.poetry.group.ui.dependencies]
mlflow = { version = "3.17.1", python = ">=3.12,<3.15" }
